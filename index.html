<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merch Design Studio</title>
  <style>
    body { background: #121214; color: #f0f0f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; margin: 0; text-align: center; padding: 20px; }
    .spinner { width: 42px; height: 42px; border: 4px solid #333; border-top-color: #E91E63; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a.btn { display: inline-block; margin-top: 18px; padding: 14px 28px; background: #E91E63; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 18px; }
    .sub { color: #888; font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="spinner" id="spin"></div>
  <h2 id="status">Connecting to Merch Studio...</h2>
  <div id="fallback"></div>
  <script>
    async function go() {
      try {
        const r = await fetch('https://api.github.com/gists/105dbc7c4b4e46c438186fbba9e09c19?t=' + Date.now(), { cache: 'no-store' });
        const data = await r.json();
        const info = JSON.parse(data.files['tunnel.json'].content);
        if (info && info.url) {
          document.getElementById('status').innerText = 'Launching Studio...';
          document.getElementById('fallback').innerHTML = '<a class="btn" href="' + info.url + '">Open Merch Studio</a><div class="sub">Updated: ' + (info.updated_at || 'Live') + '</div>';
          window.location.replace(info.url);
        }
      } catch (e) {
        document.getElementById('status').innerText = 'Tap below to open studio:';
      }
    }
    go();
  </script>
</body>
</html>
