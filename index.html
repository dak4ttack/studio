<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merch Design Studio — Smart Router</title>
  <style>
    body { background: #121214; color: #f0f0f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 92vh; margin: 0; text-align: center; padding: 20px; }
    .spinner { width: 42px; height: 42px; border: 4px solid #333; border-top-color: #E91E63; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
    a.btn { display: inline-block; padding: 13px 22px; background: #E91E63; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 700; font-size: 16px; }
    a.btn-cloud { background: #263238; border: 1px solid #455A64; }
    .sub { color: #888; font-size: 13px; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="spinner" id="spin"></div>
  <h2 id="status">Checking if Home PC is online...</h2>
  <div id="fallback"></div>
  <script>
    function probePcOnline(pcUrl, timeoutMs) {
      return new Promise((resolve) => {
        const img = new Image();
        let done = false;
        const timer = setTimeout(() => {
          if (!done) { done = true; resolve(false); }
        }, timeoutMs);
        img.onload = () => {
          if (!done) { done = true; clearTimeout(timer); resolve(true); }
        };
        img.onerror = () => {
          if (!done) { done = true; clearTimeout(timer); resolve(false); }
        };
        img.src = pcUrl.replace(/\/$/, '') + '/favicon.png?t=' + Date.now();
      });
    }

    async function route() {
      const params = new URLSearchParams(window.location.search);
      const defaultCloud = 'https://dak4ttack-merch-studio.streamlit.app';
      try {
        const r = await fetch('https://api.github.com/gists/105dbc7c4b4e46c438186fbba9e09c19?t=' + Date.now(), { cache: 'no-store' });
        const data = await r.json();
        const info = JSON.parse(data.files['tunnel.json'].content);
        const pcUrl = info.url || '';
        const cloudUrl = info.cloud_url || defaultCloud;

        document.getElementById('fallback').innerHTML =
          '<div class="btn-row">' +
          '<a class="btn" href="' + pcUrl + '">🖥️ Home PC Studio</a>' +
          '<a class="btn btn-cloud" href="' + cloudUrl + '">☁️ 24/7 Cloud Studio</a>' +
          '</div><div class="sub">Last PC sync: ' + (info.updated_at || 'Live') + '</div>';

        if (params.get('cloud') === '1') {
          document.getElementById('status').innerText = 'Opening 24/7 Cloud Studio...';
          window.location.replace(cloudUrl);
          return;
        }

        if (pcUrl) {
          const isPcAwake = await probePcOnline(pcUrl, 2500);
          if (isPcAwake) {
            document.getElementById('status').innerText = 'Home PC is ON! Connecting to local studio...';
            const pinQ = params.get("pin") ? ("?pin=" + encodeURIComponent(params.get("pin"))) : ""; window.location.replace(pcUrl + pinQ);
            return;
          }
        }

        document.getElementById('status').innerText = 'Home PC is OFF — Routing to 24/7 Cloud Studio...';
        window.location.replace(cloudUrl);
      } catch (e) {
        document.getElementById('status').innerText = 'Select Studio Mode:';
      }
    }
    route();
  </script>
</body>
</html>
